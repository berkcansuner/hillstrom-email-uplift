[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hillstrom"
version = "0.1.0"
description = "Helpers for the Hillstrom email A/B test and uplift analysis"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: tests that need the real raw CSV in data/raw/"]
